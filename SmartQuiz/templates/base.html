<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quizard{% endblock %}</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f5f7fa;
            --bg-card: #ffffff;
            --text-main: #2d2d2d;
            --text-muted: #6f6f6f;
            --primary: #4f6cff;
            --primary-soft: #e9edff;
            --border: #e3e6eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #f5f7fa, #eef1f6);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--primary);
        }

        nav a {
            margin-left: 2rem;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background: var(--primary);
            left: 0;
            bottom: -6px;
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Main container */
        main {
            flex: 1;
            max-width: 1150px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1, h2, h3 {
            margin-top: 0;
            letter-spacing: -0.5px;
        }

        p {
            line-height: 1.7;
            color: var(--text-muted);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79,108,255,0.25);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-soft);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Quizard</div>
    <nav>
        <a href="/">Home</a>
        <a href="/summarAI/">Summarize</a>
        <a href="/quiz/">Quiz</a>
    </nav>
</header>

<main>
    <div class="card">
        {% block content %}
        <!-- Page specific content -->
        {% endblock %}
    </div>
</main>

<footer>
    &copy; {{ year|default:2025 }} Quizard · Personalized Study & Smart Quizzes
</footer>

</body>
</html>
